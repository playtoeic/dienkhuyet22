<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Điền Khuyết 22 - PLAYTOEIC</title>
    <style>
        :root {
            --peach: #ffb7b2;
            --dark-peach: #ff8b94;
            --black: #1a1a1a;
            --gray: #2d2d2d;
            --white: #ffffff;
            --bright-green: #00ff00;
            --red: #ff6b6b;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        body.holding, body.holding .drop-zone:not(.correct) { cursor: crosshair; }

        .master-audio-container {
            background-color: var(--dark-peach);
            padding: 5px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #masterAudio { width: 80%; height: 30px; }

        .master-audio-container span {
            color: var(--black);
            font-weight: bold;
            font-size: 0.8rem;
        }

        header {
            background-color: var(--black);
            color: var(--peach);
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--peach);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
        }

        .word-bank-column {
            flex: 1;
            background-color: var(--gray);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            border: 2px solid var(--peach);
        }

        .word-group h3 {
            color: var(--peach);
            font-size: 0.8rem;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,183,178,0.3);
            text-transform: uppercase;
        }

        .words-container { display: flex; flex-wrap: wrap; gap: 8px; }

        .word {
            background-color: var(--peach);
            color: var(--black);
            padding: 5px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
            user-select: none;
        }

        .word:hover:not(.used) { background-color: var(--white); }

        /* Từ đang được cầm */
        .word.selected {
            outline: 2px dashed var(--white);
            outline-offset: 2px;
            opacity: 0.5;
        }

        .word.used {
            opacity: 0.2;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* Bản sao đi theo con trỏ */
        #ghost {
            position: fixed;
            left: 0; top: 0;
            pointer-events: none;
            z-index: 2000;
            background-color: var(--peach);
            color: var(--black);
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            display: none;
            white-space: nowrap;
        }

        .content-column {
            flex: 2.5;
            overflow-y: auto;
            padding-right: 15px;
        }

        .exercise-block {
            background-color: var(--gray);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 8px solid var(--peach);
        }

        .dialogue-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .section-title { color: var(--peach); font-weight: bold; font-size: 1.1rem; }

        .play-btn {
            background-color: var(--peach);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .line { margin-bottom: 6px; line-height: 1.6; font-size: 0.95rem; }
        .speaker { font-weight: bold; color: var(--peach); min-width: 45px; display: inline-block; }

        .drop-zone {
            display: inline-block;
            min-width: 80px;
            border-bottom: 2px dashed var(--peach);
            text-align: center;
            margin: 0 4px;
            height: 20px;
            vertical-align: bottom;
            cursor: default;
            transition: background-color 0.2s, color 0.3s;
            color: rgba(255,183,178,0.5);
            font-size: 0.8rem;
        }

        body.holding .drop-zone:not(.correct):hover {
            background-color: rgba(255,183,178,0.15);
        }

        .drop-zone.correct {
            color: var(--bright-green);
            border-bottom: 2px solid var(--bright-green);
            font-weight: bold;
            font-size: 0.95rem;
        }

        .drop-zone.wrong { border-bottom: 2px solid var(--red); animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--peach); border-radius: 10px; }
    </style>
</head>

    function cyrb53(str, seed = 0) {
        let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
        for (let i = 0, ch; i < str.length; i++) {
            ch = str.charCodeAt(i);
            h1 = Math.imul(h1 ^ ch, 2654435761);
            h2 = Math.imul(h2 ^ ch, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
        h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
        h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function isCorrect(blankNo, word) {
        return cyrb53(`PT22#${blankNo}#${word}`, 22) === KEYS[blankNo - 1];

    function shuffleArray(array) {

    // ===== Cầm từ / thả từ =====
    let held = null;              // ô từ đang cầm (phần tử .word)
    const ghost = document.getElementById('ghost');

    function moveGhost(x, y) {
        ghost.style.transform = `translate(${x + 14}px, ${y + 14}px)`;
    }

    function pickUp(el, x, y) {
        drop();
        held = el;
        el.classList.add('selected');
        ghost.textContent = el.textContent;
        ghost.style.display = 'block';
        moveGhost(x, y);
        document.body.classList.add('holding');
    }

    function drop() {
        if (held) held.classList.remove('selected');
        held = null;
        ghost.style.display = 'none';
        document.body.classList.remove('holding');
    }

    function tryPlace(zone) {
        if (!held || zone.classList.contains('correct')) return;
        const word = held.textContent;
        if (isCorrect(Number(zone.dataset.no), word)) {
            zone.textContent = word;
            zone.className = 'drop-zone correct';
            held.classList.add('used');
            drop();
        } else {
            // Sai: rung ô trống, vẫn giữ từ trên tay để thử chỗ khác
            zone.classList.remove('wrong');
            void zone.offsetWidth;
            zone.classList.add('wrong');
            setTimeout(() => zone.classList.remove('wrong'), 500);
        }
    }

    document.addEventListener('pointermove', e => { if (held) moveGhost(e.clientX, e.clientY); });

    document.addEventListener('click', e => {
        const word = e.target.closest('.word');
        if (word) {
            if (word.classList.contains('used')) return;
            if (word === held) drop();               // nhấn lại từ đang cầm = bỏ
            else pickUp(word, e.clientX, e.clientY);
            return;
        }
        const zone = e.target.closest('.drop-zone');
        if (zone) { tryPlace(zone); return; }
        // nhấn chỗ khác (trừ trình phát âm thanh / nút nghe) = bỏ từ
        if (!e.target.closest('audio, .play-btn, .master-audio-container')) drop();
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') drop(); });
    document.addEventListener('contextmenu', e => { if (held) { e.preventDefault(); drop(); } });

    // ===== Dựng giao diện =====
    function init() {
        const bank = document.getElementById('wordBank');
        const content = document.getElementById('exerciseContent');
        const masterAudio = document.getElementById('masterAudio');

        wordGroups.forEach((list, gi) => {
            const group = document.createElement('div');
            group.className = 'word-group';
            group.innerHTML = `<h3>NHÓM ${gi + 1}</h3><div class="words-container"></div>`;
            const container = group.querySelector('.words-container');
            shuffleArray([...list]).forEach(w => {
                const el = document.createElement('div');
                el.className = 'word';
                el.textContent = w;
                container.appendChild(el);
            });
            bank.appendChild(group);
        });

        data.forEach(part => {
            const block = document.createElement('div');
            block.className = 'exercise-block';
            const linesHtml = part.lines.map(line => {
                const text = line.t.replace(/\((\d+)\)_______/g,
                    (_, n) => `<span class="drop-zone" data-no="${n}">(${n})</span>`);
                return `<div class="line"><span class="speaker">${line.s}:</span> ${text}</div>`;
            }).join('');

            block.innerHTML = `
                <div class="dialogue-header">
                    <button class="play-btn" data-start="${part.start}" data-end="${part.end}">▶</button>
                    <span class="section-title">Đoạn ${part.title}</span>
                </div>
                ${linesHtml}
            `;
            content.appendChild(block);
        });

        let stopAt = null;
        masterAudio.addEventListener('timeupdate', () => {
            if (stopAt !== null && masterAudio.currentTime >= stopAt) {
                masterAudio.pause();
                stopAt = null;
            }
        });

        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.onclick = () => {
                const start = parseFloat(btn.dataset.start);
                const end = parseFloat(btn.dataset.end);
                const playSegment = () => {
                    stopAt = end;
                    masterAudio.currentTime = start;
                    masterAudio.play();
                };
                if (masterAudio.readyState >= 1) playSegment();
                else masterAudio.addEventListener('loadedmetadata', playSegment, { once: true });
            };
        });
    }

    window.onload = init;
</script>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Điền Khuyết 22 - PLAYTOEIC</title>
    <style>
        :root {
            --peach: #ffb7b2;
            --dark-peach: #ff8b94;
            --black: #1a1a1a;
            --gray: #2d2d2d;
            --white: #ffffff;
            --bright-green: #00ff00;
            --red: #ff6b6b;
        }

        body {
            background-color: var(--black);
            color: var(--white);
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        body.holding, body.holding .drop-zone:not(.correct) { cursor: crosshair; }

        .master-audio-container {
            background-color: var(--dark-peach);
            padding: 5px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #masterAudio { width: 80%; height: 30px; }

        .master-audio-container span {
            color: var(--black);
            font-weight: bold;
            font-size: 0.8rem;
        }

        header {
            background-color: var(--black);
            color: var(--peach);
            padding: 1rem;
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--peach);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
        }

        .word-bank-column {
            flex: 1;
            background-color: var(--gray);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            border: 2px solid var(--peach);
        }

        .word-group h3 {
            color: var(--peach);
            font-size: 0.8rem;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,183,178,0.3);
            text-transform: uppercase;
        }

        .words-container { display: flex; flex-wrap: wrap; gap: 8px; }

        .word {
            background-color: var(--peach);
            color: var(--black);
            padding: 5px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s;
            user-select: none;
        }

        .word:hover:not(.used) { background-color: var(--white); }

        /* Từ đang được cầm */
        .word.selected {
            outline: 2px dashed var(--white);
            outline-offset: 2px;
            opacity: 0.5;
        }

        .word.used {
            opacity: 0.2;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        /* Bản sao đi theo con trỏ */
        #ghost {
            position: fixed;
            left: 0; top: 0;
            pointer-events: none;
            z-index: 2000;
            background-color: var(--peach);
            color: var(--black);
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 6px 16px rgba(0,0,0,0.6);
            display: none;
            white-space: nowrap;
        }

        .content-column {
            flex: 2.5;
            overflow-y: auto;
            padding-right: 15px;
        }

        .exercise-block {
            background-color: var(--gray);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 8px solid var(--peach);
        }

        .dialogue-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .section-title { color: var(--peach); font-weight: bold; font-size: 1.1rem; }

        .play-btn {
            background-color: var(--peach);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .line { margin-bottom: 6px; line-height: 1.6; font-size: 0.95rem; }
        .speaker { font-weight: bold; color: var(--peach); min-width: 45px; display: inline-block; }

        .drop-zone {
            display: inline-block;
            min-width: 80px;
            border-bottom: 2px dashed var(--peach);
            text-align: center;
            margin: 0 4px;
            height: 20px;
            vertical-align: bottom;
            cursor: default;
            transition: background-color 0.2s, color 0.3s;
            color: rgba(255,183,178,0.5);
            font-size: 0.8rem;
        }

        body.holding .drop-zone:not(.correct):hover {
            background-color: rgba(255,183,178,0.15);
        }

        .drop-zone.correct {
            color: var(--bright-green);
            border-bottom: 2px solid var(--bright-green);
            font-weight: bold;
            font-size: 0.95rem;
        }

        .drop-zone.wrong { border-bottom: 2px solid var(--red); animation: shake 0.3s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--peach); border-radius: 10px; }
    </style>
</head>
<body>

<div class="master-audio-container">
    <span>AUDIO PLAYER:</span>
    <audio id="masterAudio" controls src="https://res.cloudinary.com/do9hddivz/video/upload/v1774353271/dk22_mglwls.mp3"></audio>
</div>

<header>ĐIỀN KHUYẾT 22 - PLAYTOEIC</header>

<div class="main-layout">
    <aside class="word-bank-column" id="wordBank"></aside>
    <main class="content-column" id="exerciseContent"></main>
</div>

<div id="ghost"></div>

<script>
    const rawWordList = [

  "calling", "technique", "prospective", "persuade", "recordings", // 14-18
  "umbrellas", "outside", "inferior", "components", "replacement", // 19-23
  "qualified", "temporary", "staffing", "agency", "branch", "mention", "discount", // 24-30
  "hospitality", "informative", "expo", "vendors", "construction", "progress", // 31-36
  "streaming", "honoree", "tirelessly", "soundtrack", "composers", // 37-41
  "figures", "retail", "virtual", "headset", "demonstrating", "purchasing", // 42-47
  "facility", "operates", "forecast", "combination", "heads-up", "shuttle", // 48-53
  "retirement", "prepping", "covering", "assignment", "potential", "available" // 54-59
];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    const data = [
  { title: "71 - 73", start: 5.5, end: 30.5, lines: [
    { s: "W-Br", t: "Attention, Casella Transit customers. (1)_______ work on the red and yellow lines will begin next week. You can expect some disruptions to regular service, so please plan ahead.", a: ["Maintenance"] },
    { s: "W-Br", t: "Use the latest version of our mobile phone (2)_______ for real-time updates. You can receive (3)_______ regarding (4)_______ if your train is impacted.", a: ["application", "notifications", "delays"] },
    { s: "W-Br", t: "Want to save on commuter rides? Purchase your (5)_______ through the mobile app as well. Printing a ticket at a (6)_______ is now subject to additional fees.", a: ["e-ticket", "kiosk"] }
  ]},
  { title: "74 - 76", start: 83.5, end: 114.5, lines: [
    { s: "W-Am", t: "Good morning, Glenman House Living Museum staff. Recently, researchers discovered the original plans for the house's gardens from the eighteenth (7)_______.", a: ["century"] },
    { s: "W-Am", t: "So, we're going to (8)_______ the gardens based on those plans! Even though we have the original designs, making an (9)_______ re-creation won't be an easy task.", a: ["restore", "authentic"] },
    { s: "W-Am", t: "We don't know what specific (10)_______ of plants were grown back then. That's why we're so lucky to have Vivek Hazarika (11)_______ on this project.", a: ["varieties", "consulting"] },
    { s: "W-Am", t: "As a gardener who has managed the (12)_______ of many historic estates, he has extensive (13)_______ in what would have been planted at the time.", a: ["grounds", "expertise"] }
  ]},
  { title: "77 - 79", start: 169.5, end: 202.0, lines: [
    { s: "M-Cn", t: "Welcome, new sales representatives, to today's session on cold (14)_______, a sales (15)_______ where we call potential clients who haven't heard of us yet.", a: ["calling", "technique"] },
    { s: "M-Cn", t: "Toward the end of the session, you'll each be given a list of (16)_______ parties to call. Your job's to (17)_______ them that what you have to say is worth their while.", a: ["prospective", "persuade"] },
    { s: "M-Cn", t: "Be friendly and avoid using scripts. Now we'll listen to some cold call (18)_______ to learn what works and what doesn't.", a: ["recordings"] }
  ]},
  { title: "80 - 82", start: 245.5, end: 283.0, lines: [
    { s: "M-Au", t: "Ms. Stewart, this is Rodrigo Gomez, president of Gomez and Sons. I want to apologize personally for the problems your restaurant experienced using our patio (19)_______.", a: ["umbrellas"] },
    { s: "M-Au", t: "At our company, we pride ourselves on doing everything in-house, from graphic design to production. But we do use (20)_______ suppliers for parts.", a: ["outside"] },
    { s: "M-Au", t: "Apparently, we received some (21)_______ metal (22)_______ . We will send you a (23)_______ set of umbrellas at no cost today, constructed with new metal parts.", a: ["inferior", "components", "replacement"] }
  ]},
  { title: "83 - 85", start: 328.5, end: 358.5, lines: [
    { s: "W-Br", t: "Temp-Time Work Solutions has hundreds of (24)_______, (25)_______ workers available to meet any of your (26)_______ needs.", a: ["qualified", "temporary", "staffing"] },
    { s: "W-Br", t: "Please call us to help your business fill open positions. We are the largest temp (27)_______ in the region, with (28)_______ offices in six locations.", a: ["agency", "branch"] },
    { s: "W-Br", t: "Let Temp-Time help you find the right person to complete just about any job! Call us at 555-0145 and (29)_______ this ad to get a twenty percent (30)_______ off our fee.", a: ["mention", "discount"] }
  ]},
  { title: "86 - 88", start: 401.5, end: 440.0, lines: [
    { s: "M-Au", t: "I've just received details about this year's (31)_______ conference. It looks like it'll be particularly (32)_______ this year. It'll be held at the end of the month.", a: ["hospitality", "informative"] },
    { s: "M-Au", t: "The conference will feature an (33)_______ of (34)_______ who serve hotel chains, which could be useful given that we'll be opening hotels in two new cities next year!", a: ["expo", "vendors"] },
    { s: "M-Au", t: "Speaking of which, Thilo visited both of those (35)_______ sites last week and is now going to give us a (36)_______ report.", a: ["construction", "progress"] }
  ]},
  { title: "89 - 91", start: 484.5, end: 524.0, lines: [
    { s: "W-Am", t: "Welcome to the annual Soundtrack Music Awards show. This year, we're (37)_______ this event live over the Internet for the very first time!", a: ["streaming"] },
    { s: "W-Am", t: "Tonight's (38)_______, Olga Alabi, founded the music label in 1996. She has worked (39)_______ to bring original (40)_______ music to film audiences.", a: ["honoree", "tirelessly", "soundtrack"] },
    { s: "W-Am", t: "She has been responsible for discovering and developing some of today's leading (41)_______ . In fact, after Ms. Alabi receives her award, some of her famous clients will perform.", a: ["composers"] }
  ]},
  { title: "92 - 94", start: 570.5, end: 602.0, lines: [
    { s: "M-Cn", t: "OK, team, let's discuss our first-quarter sales (42)_______ . Unfortunately, (43)_______ sales of our smartwatches and other products have continued to fall.", a: ["figures", "retail"] },
    { s: "M-Cn", t: "Our president has proposed expanding the product line to include a (44)_______ reality (45)_______ . And those have been popular lately.", a: ["virtual", "headset"] },
    { s: "M-Cn", t: "Next on the agenda, Raya will be (46)_______ the new software we'll be using to track consumer (47)_______ trends.", a: ["demonstrating", "purchasing"] }
  ]},
  { title: "95 - 97", start: 649.5, end: 686.5, lines: [
    { s: "M-Au", t: "Please follow me, and we'll begin today's tour. Many of our visitors are just curious about how a modern sports (48)_______ of this size (49)_______.", a: ["facility", "operates"] },
    { s: "M-Au", t: "Fortunately, today's (50)_______ shows a mix of sun and clouds. That's just the right (51)_______ for spending some time outside on the field comfortably.", a: ["forecast", "combination"] },
    { s: "M-Au", t: "Also, as a (52)_______, a (53)_______ bus will meet us at the end of the tour to bring us all back to the parking lot.", a: ["heads-up", "shuttle"] }
  ]},
  { title: "98 - 100", start: 735.5, end: 766.0, lines: [
    { s: "W-Br", t: "As you all know, we're hosting a large event tonight. It's a dinner party to celebrate the (54)_______ of a longtime employee. The chefs are already (55)_______ dinner.", a: ["retirement", "prepping"] },
    { s: "W-Br", t: "Amanda couldn't make it, so Kota's (56)_______ for her and will take Amanda's (57)_______ .", a: ["covering", "assignment"] },
    { s: "W-Br", t: "I have a meeting with a (58)_______ client at noon, but otherwise, I'll be (59)_______ all day if anything comes up.", a: ["potential", "available"] }
  ]}
];

    // ===== Cầm từ / thả từ =====
    let held = null;              // ô từ đang cầm (phần tử .word)
    const ghost = document.getElementById('ghost');

    function moveGhost(x, y) {
        ghost.style.transform = `translate(${x + 14}px, ${y + 14}px)`;
    }

    function pickUp(el, x, y) {
        drop();
        held = el;
        el.classList.add('selected');
        ghost.textContent = el.textContent;
        ghost.style.display = 'block';
        moveGhost(x, y);
        document.body.classList.add('holding');
    }

    function drop() {
        if (held) held.classList.remove('selected');
        held = null;
        ghost.style.display = 'none';
        document.body.classList.remove('holding');
    }

    function tryPlace(zone) {
        if (!held || zone.classList.contains('correct')) return;
        const word = held.textContent;
        if (word === zone.dataset.answer) {
            zone.textContent = word;
            zone.className = 'drop-zone correct';
            held.classList.add('used');
            drop();
        } else {
            // Sai: rung ô trống, vẫn giữ từ trên tay để thử chỗ khác
            zone.classList.remove('wrong');
            void zone.offsetWidth;
            zone.classList.add('wrong');
            setTimeout(() => zone.classList.remove('wrong'), 500);
        }
    }

    document.addEventListener('pointermove', e => { if (held) moveGhost(e.clientX, e.clientY); });

    document.addEventListener('click', e => {
        const word = e.target.closest('.word');
        if (word) {
            if (word.classList.contains('used')) return;
            if (word === held) drop();               // nhấn lại từ đang cầm = bỏ
            else pickUp(word, e.clientX, e.clientY);
            return;
        }
        const zone = e.target.closest('.drop-zone');
        if (zone) { tryPlace(zone); return; }
        // nhấn chỗ khác (trừ trình phát âm thanh / nút nghe) = bỏ từ
        if (!e.target.closest('audio, .play-btn, .master-audio-container')) drop();
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') drop(); });
    document.addEventListener('contextmenu', e => { if (held) { e.preventDefault(); drop(); } });

    // ===== Dựng giao diện =====
    function init() {
        const bank = document.getElementById('wordBank');
        const content = document.getElementById('exerciseContent');
        const masterAudio = document.getElementById('masterAudio');

        for (let i = 0; i < rawWordList.length; i += 30) {
            const group = document.createElement('div');
            group.className = 'word-group';
            group.innerHTML = `<h3>NHÓM ${Math.floor(i / 30) + 1}</h3><div class="words-container"></div>`;
            const container = group.querySelector('.words-container');

            let subList = rawWordList.slice(i, i + 30);
            shuffleArray(subList);

            subList.forEach(w => {
                const el = document.createElement('div');
                el.className = 'word';
                el.textContent = w;
                container.appendChild(el);
            });
            bank.appendChild(group);
        }

        data.forEach(part => {
            const block = document.createElement('div');
            block.className = 'exercise-block';
            const linesHtml = part.lines.map(line => {
                let currentAnswers = Array.isArray(line.a) ? [...line.a] : [line.a];
                const text = line.t.replace(/_______/g, () => {
                    const ans = currentAnswers.shift();
                    return `<span class="drop-zone" data-answer="${ans}"></span>`;
                });
                return `<div class="line"><span class="speaker">${line.s}:</span> ${text}</div>`;
            }).join('');

            block.innerHTML = `
                <div class="dialogue-header">
                    <button class="play-btn" data-start="${part.start}" data-end="${part.end}">▶</button>
                    <span class="section-title">Đoạn ${part.title}</span>
                </div>
                ${linesHtml}
            `;
            content.appendChild(block);
        });

        let stopAt = null;
        masterAudio.addEventListener('timeupdate', () => {
            if (stopAt !== null && masterAudio.currentTime >= stopAt) {
                masterAudio.pause();
                stopAt = null;
            }
        });

        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.onclick = () => {
                const start = parseFloat(btn.dataset.start);
                const end = parseFloat(btn.dataset.end);
                const playSegment = () => {
                    stopAt = end;
                    masterAudio.currentTime = start;
                    masterAudio.play();
                };
                if (masterAudio.readyState >= 1) playSegment();
                else masterAudio.addEventListener('loadedmetadata', playSegment, { once: true });
            };
        });
    }

    window.onload = init;
</script>
</body>
</html>

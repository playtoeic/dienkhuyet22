<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Điền Khuyết 22 - PLAYTOEIC</title>
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
    <!-- Satoshi thiếu một số chữ tiếng Việt (vd: Ỗ, Ữ) → dùng Be Vietnam Pro bù cho các chữ đó -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* Bảng màu lấy theo ảnh 1: trời xanh thép, đá xám lạnh, HUD cyan, tia lửa cam */
        :root {
            --bg-deep: #0b141b;
            --bg: #111e27;
            --panel: #172833;
            --panel-2: #1e3441;
            --steel: #2f4757;
            --mist: #8fb1c2;
            --text: #e6f1f6;
            --text-dim: #9db4c0;
            --hud: #6fe6f2;
            --hud-strong: #2fd0e3;
            --hud-glow: rgba(111,230,242,0.35);
            --flash: #ff9a3c;
            --flash-hot: #ffd27a;
            --good: #7dffb0;
            --bad: #ff5a4f;
        }

        * { box-sizing: border-box; }

        /* Nhãn tiếng Việt: dùng Be Vietnam Pro để dấu (Ỗ, Ữ, Ẫ…) hiển thị đúng; tiếng Anh vẫn dùng Satoshi */
        .section-status, .section-title, #weaponName, .hp-label, .score-box .label,
        .word-group h3, .hud-title, #banner, #gameOver, .popup {
            font-family: 'Be Vietnam Pro', 'Satoshi', 'Segoe UI', Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(1200px 500px at 70% -10%, rgba(143,177,194,0.18), transparent 60%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--text);
            font-family: 'Satoshi', 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        body.holding { cursor: none; }
        body.holding * { cursor: none !important; }

        /* ===== Thanh audio ===== */
        .master-audio-container {
            background: var(--panel);
            border-bottom: 1px solid rgba(111,230,242,0.25);
            padding: 6px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 1000;
        }
        #masterAudio { width: 80%; height: 30px; }
        .master-audio-container span {
            color: var(--hud);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
        }

        /* ===== HUD trên cùng ===== */
        .hud {
            display: grid;
            grid-template-columns: 1fr minmax(220px, 420px) 1fr;
            align-items: center;
            gap: 24px;
            padding: 14px 24px;
            background: rgba(17,30,39,0.92);
            border-bottom: 1px solid rgba(111,230,242,0.18);
        }
        .hud-title {
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 0.04em;
            color: var(--text);
        }
        .hud-title small {
            display: block;
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            color: var(--hud);
        }

        .hp-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--hud);
            margin-bottom: 6px;
        }
        .hp-bar {
            height: 12px;
            border: 1px solid rgba(111,230,242,0.5);
            border-radius: 2px;
            padding: 2px;
            background: rgba(11,20,27,0.6);
            clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 8px 100%);
        }
        #hpFill {
            height: 100%;
            width: 100%;
            background: repeating-linear-gradient(90deg, var(--hud) 0 14px, transparent 14px 17px);
            box-shadow: 0 0 10px var(--hud-glow);
            transition: width 0.35s ease, filter 0.3s;
        }
        #hpFill.low { filter: hue-rotate(160deg) saturate(2); }
        .hud.hit { animation: hudHit 0.35s; }
        @keyframes hudHit {
            0%, 100% { background: rgba(17,30,39,0.92); }
            30% { background: rgba(90,30,30,0.95); }
        }

        .hud-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 18px;
        }
        .score-box { text-align: right; }
        .score-box .label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: var(--hud);
        }
        #score {
            font-size: 2rem;
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        #score.bump { animation: bump 0.3s; }
        @keyframes bump { 50% { transform: scale(1.25); color: var(--good); } }
        #weaponName {
            font-size: 0.72rem;
            color: var(--text-dim);
            letter-spacing: 0.08em;
        }
        .icon-btn {
            background: transparent;
            border: 1px solid rgba(111,230,242,0.4);
            color: var(--hud);
            border-radius: 4px;
            width: 34px;
            height: 34px;
            font-size: 1rem;
            cursor: pointer;
        }
        .icon-btn:hover { background: rgba(111,230,242,0.12); }

        /* ===== Bố cục chính ===== */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
        }

        .word-bank-column {
            flex: 1;
            background: rgba(23,40,51,0.85);
            border: 1px solid rgba(111,230,242,0.25);
            border-radius: 6px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }
        .word-group h3 {
            color: var(--hud);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            margin: 0 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(111,230,242,0.2);
        }
        .words-container { display: flex; flex-wrap: wrap; gap: 8px; }

        .word {
            background: var(--panel-2);
            color: var(--text);
            border: 1px solid var(--steel);
            border-left: 3px solid var(--hud-strong);
            padding: 6px 11px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.86rem;
            transition: background 0.15s, border-color 0.15s, opacity 0.3s;
            user-select: none;
        }
        .word:hover:not(.used) { background: #26414f; border-color: var(--hud); }
        .word.selected {
            background: rgba(111,230,242,0.15);
            border-color: var(--hud);
            box-shadow: 0 0 12px var(--hud-glow);
        }
        .word.used {
            opacity: 0.22;
            cursor: not-allowed;
            border-left-color: var(--steel);
        }

        .content-column {
            flex: 2.5;
            overflow-y: auto;
            padding-right: 15px;
            padding-bottom: 300px; /* chừa chỗ cho khẩu súng */
        }

        .exercise-block {
            background: rgba(23,40,51,0.85);
            border: 1px solid rgba(111,230,242,0.15);
            border-left: 4px solid var(--hud-strong);
            border-radius: 6px;
            padding: 18px 22px;
            margin-bottom: 22px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .exercise-block.perfect {
            border-color: rgba(125,255,176,0.5);
            border-left-color: var(--good);
            box-shadow: 0 0 18px rgba(125,255,176,0.12);
        }
        .exercise-block.done:not(.perfect) { border-left-color: var(--mist); }

        .dialogue-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }
        .section-title { color: var(--text); font-weight: 900; font-size: 1.05rem; letter-spacing: 0.02em; }
        .section-status { margin-left: auto; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; color: var(--text-dim); }
        .exercise-block.perfect .section-status { color: var(--good); font-size: 0.85rem; }
        .exercise-block.running { border-left-color: var(--flash); }
        .exercise-block.running .section-status { color: var(--flash); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.45; } }

        .play-btn {
            background: transparent;
            color: var(--hud);
            border: 1px solid var(--hud);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .play-btn:hover { background: rgba(111,230,242,0.15); }

        .line { margin-bottom: 8px; line-height: 1.75; font-size: 0.98rem; font-weight: 500; }
        .speaker { font-weight: 900; color: var(--hud); min-width: 50px; display: inline-block; font-size: 0.85rem; }

        .drop-zone {
            display: inline-block;
            min-width: 86px;
            border-bottom: 2px dashed var(--mist);
            text-align: center;
            margin: 0 4px;
            height: 22px;
            vertical-align: bottom;
            transition: background-color 0.15s, color 0.3s;
        }
        body.holding .drop-zone:not(.correct):hover {
            background: rgba(111,230,242,0.14);
            border-bottom-color: var(--hud);
        }
        .drop-zone.correct {
            color: var(--good);
            border-bottom: 2px solid var(--good);
            font-weight: 900;
        }
        .drop-zone.wrong { border-bottom: 2px solid var(--bad); background: rgba(255,90,79,0.15); animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--steel); border-radius: 10px; }

        /* ===== Tâm ngắm đi theo chuột khi đang cầm từ ===== */
        #reticle {
            position: fixed;
            left: 0; top: 0;
            pointer-events: none;
            z-index: 3000;
            display: none;
        }
        body.holding #reticle { display: block; }
        #reticle .ring {
            position: absolute;
            left: -22px; top: -22px;
            width: 44px; height: 44px;
            border: 2px solid var(--hud);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--hud-glow);
        }
        #reticle .ring::before, #reticle .ring::after {
            content: "";
            position: absolute;
            background: var(--hud);
        }
        #reticle .ring::before { left: 50%; top: -8px; width: 2px; height: 56px; margin-left: -1px;
            mask: linear-gradient(#000 0 10px, transparent 10px 46px, #000 46px); -webkit-mask: linear-gradient(#000 0 10px, transparent 10px 46px, #000 46px); }
        #reticle .ring::after { top: 50%; left: -8px; height: 2px; width: 56px; margin-top: -1px;
            mask: linear-gradient(90deg, #000 0 10px, transparent 10px 46px, #000 46px); -webkit-mask: linear-gradient(90deg, #000 0 10px, transparent 10px 46px, #000 46px); }
        #reticle .dot {
            position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%;
            background: var(--flash-hot);
        }
        #reticle .tag {
            position: absolute;
            left: 30px; top: 14px;
            background: rgba(11,20,27,0.85);
            border: 1px solid var(--hud);
            color: var(--hud);
            font-weight: 700;
            font-size: 0.85rem;
            padding: 3px 9px;
            border-radius: 3px;
            white-space: nowrap;
        }

        /* ===== Khẩu súng ===== */
        #gunRig {
            position: fixed;
            right: 0;
            bottom: 0;
            width: min(600px, 50vw);
            aspect-ratio: 520 / 360;
            pointer-events: none;
            z-index: 1500;
            transform-origin: 100% 100%;
            will-change: transform;
        }
        #gunInner { width: 100%; height: 100%; transform-origin: 100% 100%; }
        #gunInner.recoil { animation: recoil 0.16s ease-out; }
        @keyframes recoil {
            0% { transform: translate(0, 0) rotate(0deg); }
            30% { transform: translate(14px, 10px) rotate(4deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        #gunRig svg { width: 100%; height: 100%; overflow: visible; display: block; }

        /* Thân trượt: cấp 1 đen nhám */
        .slide-top { fill: url(#slideTopMatte); }
        .slide-side { fill: url(#slideSideMatte); }
        .slide-rear { fill: #1d2328; }
        .slide-edge { stroke: #6d7882; stroke-width: 1.5; opacity: 0.6; }
        .accent { fill: #e9eef1; opacity: 0.8; }
        .accent-line { stroke: transparent; }
        /* Cấp 2: thân bạc, điểm ngắm cyan phát sáng */
        #gunRig.lv2 .slide-top { fill: url(#slideTopChrome); }
        #gunRig.lv2 .slide-side { fill: url(#slideSideChrome); }
        #gunRig.lv2 .slide-rear { fill: #7f909a; }
        #gunRig.lv2 .slide-edge { stroke: #ffffff; opacity: 0.9; }
        #gunRig.lv2 .accent { fill: #6fe6f2; opacity: 1; filter: drop-shadow(0 0 3px #6fe6f2); }
        #gunRig.lv2 .accent-line { stroke: #2fd0e3; stroke-width: 2; opacity: 0.8; }

        /* Thân trượt lùi về khi bắn */
        .slide.blow { animation: blow 0.12s ease-out; }
        @keyframes blow {
            40% { transform: translate(18px, 9px); }
            100% { transform: translate(0, 0); }
        }
        .flash { opacity: 0; transform-box: fill-box; transform-origin: center; }
        .flash.on { animation: flash 0.11s ease-out; }
        @keyframes flash {
            0% { opacity: 1; transform: scale(0.6) rotate(0deg); }
            100% { opacity: 0; transform: scale(1.4) rotate(20deg); }
        }
        #gunInner.equip { animation: equip 0.6s ease-out; }
        @keyframes equip {
            0% { transform: translate(140px, 200px) rotate(10deg); }
            100% { transform: translate(0, 0); }
        }

        /* Đường đạn */
        #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1600; }
        .tracer { stroke-linecap: round; animation: tracer 0.18s ease-out forwards; }
        @keyframes tracer { from { opacity: 1; } to { opacity: 0; } }
        .impact { animation: impact 0.3s ease-out forwards; transform-box: fill-box; transform-origin: center; }
        @keyframes impact { from { opacity: 1; transform: scale(0.3); } to { opacity: 0; transform: scale(1.6); } }

        /* Chữ nổi +1 / -10 */
        .popup {
            position: fixed;
            pointer-events: none;
            z-index: 2500;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            transform: translate(-50%, -100%);
            animation: popup 0.9s ease-out forwards;
        }
        .popup.good { color: var(--good); }
        .popup.bad { color: var(--bad); }
        .popup.bonus { color: var(--hud); font-size: 1.3rem; }
        @keyframes popup {
            from { opacity: 1; margin-top: 0; }
            to { opacity: 0; margin-top: -46px; }
        }

        /* Thông báo nâng cấp / hết máu */
        #banner {
            position: fixed;
            left: 50%; top: 22%;
            transform: translateX(-50%);
            z-index: 2600;
            pointer-events: none;
            text-align: center;
            display: none;
            background: rgba(11,20,27,0.9);
            border: 1px solid var(--hud);
            border-radius: 6px;
            padding: 18px 36px;
            box-shadow: 0 0 40px rgba(111,230,242,0.25);
        }
        #banner.show { display: block; animation: banner 2.4s ease-out forwards; }
        #banner .big { font-size: 2.2rem; font-weight: 900; color: var(--hud); text-shadow: 0 0 24px var(--hud-glow); letter-spacing: 0.06em; }
        #banner .small { font-size: 0.9rem; font-weight: 700; color: var(--text); letter-spacing: 0.2em; margin-top: 6px; }
        @keyframes banner {
            0% { opacity: 0; transform: translateX(-50%) scale(1.3); }
            12% { opacity: 1; transform: translateX(-50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        #gameOver {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: rgba(11,20,27,0.88);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }
        #gameOver.show { display: flex; }
        #gameOver h2 { margin: 0; font-size: 2.6rem; font-weight: 900; color: var(--bad); letter-spacing: 0.08em; }
        #gameOver p { margin: 0; color: var(--text-dim); font-size: 1rem; }
        #gameOver button {
            margin-top: 10px;
            background: var(--hud);
            color: var(--bg-deep);
            border: none;
            font-family: inherit;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 0.1em;
            padding: 12px 28px;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; overflow-y: auto; }
            .word-bank-column { max-height: 34vh; flex: none; }
            .content-column { overflow: visible; padding-bottom: 200px; }
            #gunRig { width: 300px; }
            .hud { grid-template-columns: 1fr; gap: 10px; }
            .hud-right { justify-content: space-between; }
        }
    </style>
</head>
<body>

<div class="master-audio-container">
    <span>AUDIO</span>
    <audio id="masterAudio" controls src="https://res.cloudinary.com/do9hddivz/video/upload/v1774353271/dk22_mglwls.mp3"></audio>
</div>

<div class="hud" id="hud">
    <div class="hud-title">ĐIỀN KHUYẾT 22<small>PLAYTOEIC · PART 4</small></div>
    <div>
        <div class="hp-label"><span>MÁU</span><span id="hpText">100</span></div>
        <div class="hp-bar"><div id="hpFill"></div></div>
    </div>
    <div class="hud-right">
        <div class="score-box">
            <div class="label">ĐIỂM</div>
            <div id="score">0</div>
            <div id="weaponName">Súng lục tiêu chuẩn</div>
        </div>
        <button class="icon-btn" id="muteBtn" title="Bật/tắt tiếng súng">🔊</button>
    </div>
</div>

<div class="main-layout">
    <aside class="word-bank-column" id="wordBank"></aside>
    <main class="content-column" id="exerciseContent"></main>
</div>

<!-- Tâm ngắm -->
<div id="reticle"><div class="ring"></div><div class="dot"></div><div class="tag" id="reticleTag"></div></div>

<!-- Hiệu ứng đường đạn -->
<svg id="fx"></svg>

<!-- Khẩu súng góc nhìn thứ nhất -->
<div id="gunRig">
  <div id="gunInner">
    <svg viewBox="0 0 520 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#55697a"/>
          <stop offset="0.45" stop-color="#2c3a46"/>
          <stop offset="1" stop-color="#151d24"/>
        </linearGradient>
        <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a4a57"/>
          <stop offset="1" stop-color="#10171d"/>
        </linearGradient>
        <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3b3f42"/>
          <stop offset="1" stop-color="#16181a"/>
        </linearGradient>
        <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#eaf3f7"/>
          <stop offset="0.5" stop-color="#a9bcc7"/>
          <stop offset="1" stop-color="#4c5f6b"/>
        </linearGradient>
        <linearGradient id="armorDark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#40576a"/>
          <stop offset="1" stop-color="#121c24"/>
        </linearGradient>
        <radialGradient id="flashFire">
          <stop offset="0" stop-color="#fff6d8"/>
          <stop offset="0.35" stop-color="#ffd27a"/>
          <stop offset="0.7" stop-color="#ff9a3c"/>
          <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="flashPlasma">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.4" stop-color="#bff7ff"/>
          <stop offset="0.75" stop-color="#6fe6f2"/>
          <stop offset="1" stop-color="#6fe6f2" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <defs>
        <linearGradient id="slideTopMatte" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5d6871"/><stop offset="1" stop-color="#2a3138"/>
        </linearGradient>
        <linearGradient id="slideSideMatte" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a434b"/><stop offset="1" stop-color="#14191d"/>
        </linearGradient>
        <linearGradient id="slideTopChrome" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#cfdbe1"/><stop offset="1" stop-color="#8ea1ac"/>
        </linearGradient>
        <linearGradient id="slideSideChrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e3ecf0"/><stop offset="0.45" stop-color="#a7b7c0"/><stop offset="1" stop-color="#55666f"/>
        </linearGradient>
        <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#262d33"/><stop offset="1" stop-color="#0d1114"/>
        </linearGradient>
        <linearGradient id="gloveGrad" x1="0" y1="0" x2="1" y2="1">

    // ===== Luật chơi =====
    const MAX_HP = 100;
    const WRONG_DAMAGE = 10;       // bắn sai: -10 máu
    const SECTION_BONUS = 5;       // bấm ▶ rồi điền hết 1 đoạn khi audio chưa dừng: PERFECT +5
    const UPGRADE_SCORE = 70;      // điểm trên 70: đổi súng

    const state = {
        hp: MAX_HP,
        score: 0,
        weapon: 1,
        over: false,
        muted: false,
        blocks: []                 // mỗi đoạn: { left: số chỗ trống còn lại, wrong: số lần sai }
    };

    const $ = id => document.getElementById(id);
    const hpFill = $('hpFill'), hpText = $('hpText'), scoreEl = $('score');
    const gunRig = $('gunRig'), gunInner = $('gunInner'), fx = $('fx');
    const reticle = $('reticle'), reticleTag = $('reticleTag');

    // ===== Âm thanh súng (tạo bằng Web Audio, không cần file) =====
    let actx = null;
    function audioCtx() {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        return actx;
    }
    function playShot(hit) {
        if (state.muted) return;
        const ctx = audioCtx();
        const t = ctx.currentTime;
        const out = ctx.createGain();
        out.gain.value = 0.35;
        out.connect(ctx.destination);

        // tiếng nổ: nhiễu trắng tắt dần
        const len = 0.18 * ctx.sampleRate;
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const lp = ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = state.weapon === 1 ? 2400 : 1700;
        src.connect(lp).connect(out);
        src.start(t);

        if (state.weapon === 2) {
            // súng bạc: thêm tiếng "thụp" trầm cho nặng tay hơn
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(140, t);
            o.frequency.exponentialRampToValueAtTime(50, t + 0.15);
            g.gain.setValueAtTime(0.9, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            o.connect(g).connect(out);
            o.start(t);
            o.stop(t + 0.2);
        }

        // tiếng báo trúng / trượt
        const b = ctx.createOscillator();
        const bg = ctx.createGain();
        b.type = hit ? 'triangle' : 'square';
        b.frequency.setValueAtTime(hit ? 880 : 140, t + 0.06);
        if (hit) b.frequency.setValueAtTime(1320, t + 0.12);
        bg.gain.setValueAtTime(0.0001, t);
        bg.gain.setValueAtTime(hit ? 0.25 : 0.18, t + 0.06);
        bg.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
        b.connect(bg).connect(out);
        b.start(t + 0.06);
        b.stop(t + 0.28);
    }

    // ===== Súng xoay theo chuột =====
    const MUZZLE_ANGLE = Math.atan2(120 - 360, 200 - 520);   // hướng nòng mặc định (từ góc phải dưới)
    let aimRot = 0, aimX = 0, aimY = 0, targetRot = 0, targetX = 0, targetY = 0;

    function updateAim(x, y) {
        const W = window.innerWidth, H = window.innerHeight;
        let ang = Math.atan2(y - H, x - W) - MUZZLE_ANGLE;
        ang = ang * 180 / Math.PI;
        targetRot = Math.max(-16, Math.min(20, ang * 0.75));
        targetX = (x / W - 0.75) * 40;
        targetY = (y / H - 0.75) * 30;
    }

    (function loop() {
        aimRot += (targetRot - aimRot) * 0.18;
        aimX += (targetX - aimX) * 0.18;
        aimY += (targetY - aimY) * 0.18;
        gunRig.style.transform = `translate(${aimX}px, ${aimY}px) rotate(${aimRot}deg)`;
        requestAnimationFrame(loop);
    })();

    function fire(x, y, hit) {
        const gun = $('pistol');
        const m = gun.querySelector('.muzzle').getBoundingClientRect();
        const mx = m.left + m.width / 2, my = m.top + m.height / 2;
        const color = state.weapon === 1 ? '#ffd27a' : '#6fe6f2';

        // đường đạn
        const ns = 'http://www.w3.org/2000/svg';
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', mx); line.setAttribute('y1', my);
        line.setAttribute('x2', x); line.setAttribute('y2', y);
        line.setAttribute('stroke', color);
        line.setAttribute('stroke-width', state.weapon === 1 ? 2.5 : 3.5);
        line.setAttribute('class', 'tracer');
        if (state.weapon === 2) line.setAttribute('filter', 'drop-shadow(0 0 6px #6fe6f2)');
        fx.appendChild(line);

        // vệt trúng
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', x); dot.setAttribute('cy', y);
        dot.setAttribute('r', 14);
        dot.setAttribute('fill', 'none');
        dot.setAttribute('stroke', hit ? '#7dffb0' : '#ff5a4f');
        dot.setAttribute('stroke-width', 3);
        dot.setAttribute('class', 'impact');
        fx.appendChild(dot);
        setTimeout(() => { line.remove(); dot.remove(); }, 320);

        // tia lửa đầu nòng + giật súng
        const flash = gun.querySelector('.flash');
        flash.classList.remove('on'); void flash.getBBox(); flash.classList.add('on');
        const slide = gun.querySelector('.slide');
        slide.classList.remove('blow'); void slide.getBBox(); slide.classList.add('blow');
        gunInner.classList.remove('recoil', 'equip'); void gunInner.offsetWidth; gunInner.classList.add('recoil');

        playShot(hit);
    }

    // ===== Điểm, máu, thông báo =====
    function popup(x, y, text, kind) {
        const p = document.createElement('div');
        p.className = `popup ${kind}`;
        p.textContent = text;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 950);
    }

    function banner(big, small) {
        const b = $('banner');
        $('bannerBig').textContent = big;
        $('bannerSmall').textContent = small;
        b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
    }

    function addScore(n) {
        state.score += n;
        scoreEl.textContent = state.score;
        scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump');
        if (state.weapon === 1 && state.score > UPGRADE_SCORE) {
            // chờ thông báo PERFECT (nếu có) chạy xong rồi mới báo đổi súng
            setTimeout(upgradeWeapon, $('banner').classList.contains('show') ? 1800 : 0);
            state.weapon = 2;
        }
    }

    function upgradeWeapon() {
        gunRig.classList.add('lv2');
        $('weaponName').textContent = 'Súng lục bạc';
        gunInner.classList.remove('recoil', 'equip'); void gunInner.offsetWidth; gunInner.classList.add('equip');
        banner('NÂNG CẤP VŨ KHÍ', `ĐẠT TRÊN ${UPGRADE_SCORE} ĐIỂM · SÚNG LỤC BẠC`);
    }

    // ===== Lượt nghe "không dừng" (PERFECT) =====
    // Bấm ▶ của 1 đoạn chưa điền chỗ nào → bắt đầu lượt. Điền hết trước khi audio dừng → PERFECT +5.
    function renderStatus(bi) {
        const blk = state.blocks[bi];
        if (blk.el.classList.contains('perfect')) return;
        const status = blk.el.querySelector('.section-status');
        const running = state.run && state.run.block === bi;
        blk.el.classList.toggle('running', !!(running && state.run.valid));
        if (running && state.run.valid) status.textContent = `● ĐANG NGHE · CÒN ${blk.left}`;
        else if (blk.left === 0) status.textContent = 'XONG';
        else status.textContent = `CÒN ${blk.left} CHỖ TRỐNG`;
    }

    function startRun(bi) {
        const blk = state.blocks[bi];
        if (blk.left === 0) return;
        state.run = { block: bi, valid: blk.left === blk.total };
        renderStatus(bi);
    }

    function endRun() {
        if (!state.run) return;
        const bi = state.run.block;
        state.run = null;
        renderStatus(bi);
    }

    function setHp(v) {
        state.hp = Math.max(0, v);
        hpFill.style.width = (state.hp / MAX_HP * 100) + '%';
        hpFill.classList.toggle('low', state.hp <= 30);
        hpText.textContent = state.hp;
        const hud = $('hud');
        hud.classList.remove('hit'); void hud.offsetWidth; hud.classList.add('hit');
        if (state.hp === 0) gameOver();
    }

    function gameOver() {
        state.over = true;
        drop();
        $('finalScore').textContent = state.score;
        $('gameOver').classList.add('show');
    }
    $('restartBtn').onclick = () => location.reload();

    $('muteBtn').onclick = () => {
        state.muted = !state.muted;
        $('muteBtn').textContent = state.muted ? '🔇' : '🔊';
    };

    // ===== Cầm từ / bắn vào chỗ trống =====
    let held = null;

    function moveReticle(x, y) { reticle.style.transform = `translate(${x}px, ${y}px)`; }

    function pickUp(el, x, y) {
        drop();
        held = el;
        el.classList.add('selected');
        reticleTag.textContent = el.textContent;
        moveReticle(x, y);
        document.body.classList.add('holding');
    }

    function drop() {
        if (held) held.classList.remove('selected');
        held = null;
        document.body.classList.remove('holding');
    }

    function tryPlace(zone, x, y) {
        if (!held || state.over || zone.classList.contains('correct')) return;
        const word = held.textContent;
        const bi = Number(zone.dataset.block);
        const blk = state.blocks[bi];
        const hit = word === zone.dataset.answer;

        fire(x, y, hit);

        if (hit) {
            zone.textContent = word;
            zone.className = 'drop-zone correct';
            held.classList.add('used');
            drop();
            addScore(1);
            popup(x, y, '+1', 'good');

            blk.left--;
            if (blk.left === 0) {
                blk.el.classList.add('done');
                const perfect = state.run && state.run.block === bi && state.run.valid;
                state.run = null;
                blk.el.classList.remove('running');
                if (perfect) {
                    blk.el.classList.add('perfect');
                    blk.el.querySelector('.section-status').textContent = `PERFECT +${SECTION_BONUS}`;
                    setTimeout(() => {
                        addScore(SECTION_BONUS);
                        popup(x, y - 30, `PERFECT +${SECTION_BONUS}`, 'bonus');
                        banner('PERFECT', `+${SECTION_BONUS} ĐIỂM · ĐIỀN HẾT KHÔNG DỪNG AUDIO`);
                    }, 250);
                } else {
                    renderStatus(bi);
                }
            } else {
                renderStatus(bi);
            }
        } else {
            blk.wrong++;
            zone.classList.remove('wrong'); void zone.offsetWidth; zone.classList.add('wrong');
            setTimeout(() => zone.classList.remove('wrong'), 500);
            popup(x, y, `-${WRONG_DAMAGE} MÁU`, 'bad');
            setHp(state.hp - WRONG_DAMAGE);
        }
    }

    document.addEventListener('pointermove', e => {
        updateAim(e.clientX, e.clientY);
        if (held) moveReticle(e.clientX, e.clientY);
    });

    document.addEventListener('click', e => {
        if (state.over) return;
        const word = e.target.closest('.word');
        if (word) {
            if (word.classList.contains('used')) return;
            if (word === held) drop();
            else pickUp(word, e.clientX, e.clientY);
            return;
        }
        const zone = e.target.closest('.drop-zone');
        if (zone) { tryPlace(zone, e.clientX, e.clientY); return; }
        if (!e.target.closest('audio, .play-btn, .master-audio-container, .icon-btn')) drop();
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') drop(); });
    document.addEventListener('contextmenu', e => { if (held) { e.preventDefault(); drop(); } });

    // ===== Dựng giao diện =====
    function init() {
        const bank = $('wordBank');
        const content = $('exerciseContent');
        const masterAudio = $('masterAudio');

        for (let i = 0; i < rawWordList.length; i += 30) {
            const group = document.createElement('div');
            group.className = 'word-group';
            group.innerHTML = `<h3>NHÓM ${Math.floor(i / 30) + 1}</h3><div class="words-container"></div>`;
            const container = group.querySelector('.words-container');

            let subList = rawWordList.slice(i, i + 30);
            shuffleArray(subList);

            subList.forEach(w => {
                const el = document.createElement('div');
                el.className = 'word';
                el.textContent = w;
                container.appendChild(el);
            });
            bank.appendChild(group);
        }

        data.forEach((part, bi) => {
            let count = 0;
            const block = document.createElement('div');
            block.className = 'exercise-block';
            const linesHtml = part.lines.map(line => {
                let currentAnswers = Array.isArray(line.a) ? [...line.a] : [line.a];
                const text = line.t.replace(/_______/g, () => {
                    const ans = currentAnswers.shift();
                    count++;
                    return `<span class="drop-zone" data-answer="${ans}" data-block="${bi}"></span>`;
                });
                return `<div class="line"><span class="speaker">${line.s}:</span> ${text}</div>`;
            }).join('');
            state.blocks.push({ total: count, left: count, wrong: 0, el: block });

            block.innerHTML = `
                <div class="dialogue-header">
                    <button class="play-btn" data-block="${bi}" data-start="${part.start}" data-end="${part.end}">▶</button>
                    <span class="section-title">Đoạn ${part.title}</span>
                    <span class="section-status">${count} CHỖ TRỐNG</span>
                </div>
                ${linesHtml}
            `;
            content.appendChild(block);
        });

        let stopAt = null;
        let selfSeek = false;
        masterAudio.addEventListener('timeupdate', () => {
            if (stopAt !== null && masterAudio.currentTime >= stopAt) {
                masterAudio.pause();
                stopAt = null;
            }
        });
        // Audio dừng (tự bấm dừng hoặc hết đoạn) / tự tua → mất lượt PERFECT
        masterAudio.addEventListener('pause', () => endRun());
        masterAudio.addEventListener('seeking', () => {
            if (selfSeek) { selfSeek = false; return; }
            endRun();
        });

        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.onclick = () => {
                const start = parseFloat(btn.dataset.start);
                const end = parseFloat(btn.dataset.end);
                const bi = Number(btn.dataset.block);
                const playSegment = () => {
                    endRun();
                    stopAt = end;
                    selfSeek = true;
                    setTimeout(() => { selfSeek = false; }, 600);
                    masterAudio.currentTime = start;
                    masterAudio.play();
                    startRun(bi);
                };
                if (masterAudio.readyState >= 1) playSegment();
                else masterAudio.addEventListener('loadedmetadata', playSegment, { once: true });
            };
        });

        updateAim(window.innerWidth * 0.6, window.innerHeight * 0.5);
    }

    window.onload = init;
</script>
</body>
</html>
